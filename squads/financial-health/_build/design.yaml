# Design output — generated by Design phase
# Input: discovery.yaml + best-practices research
# Date: 2026-04-30

squad:
  code: "financial-health"
  name: "Squad de Saúde Financeira"
  description: "Analisa Receita, Custos e Margem a partir de planilha ou CSV para gerar diagnóstico financeiro completo, identificar riscos e recomendar ações priorizadas"

agents:
  - id: "felipe-financeiro"
    name: "Felipe Financeiro"
    title: "Analista de Dados Financeiros"
    icon: "📊"
    execution: "inline"
    role_summary: "Lê o CSV, calcula todos os indicadores financeiros (margens, unit economics, ponto de equilíbrio, projeção de caixa) e organiza as métricas em relatório estruturado"
    skills: []
    tasks:
      - name: "calculate-financials"
        file: "tasks/calculate-financials.md"
        description: "Calcula receita líquida, margens, CAC, LTV, ponto de equilíbrio e projeção de caixa a partir do CSV"

  - id: "gustavo-gestor"
    name: "Gustavo Gestor"
    title: "Estrategista Financeiro"
    icon: "💼"
    execution: "inline"
    role_summary: "Lê as métricas do Felipe e produz o diagnóstico estratégico: executive summary, análise por área, vazamentos de margem, capacidade de escala, plano de ação e alocação de capital"
    skills: []
    tasks:
      - name: "strategic-diagnosis"
        file: "tasks/strategic-diagnosis.md"
        description: "Transforma métricas financeiras em diagnóstico estratégico com plano de ação priorizado"

  - id: "renata-revisao"
    name: "Renata Revisão"
    title: "Revisora de Diagnóstico Financeiro"
    icon: "🔍"
    execution: "inline"
    role_summary: "Verifica matematicamente os cálculos do Felipe, rastreia as recomendações do Gustavo a dados e emite veredicto estruturado com feedback acionável"
    skills: []
    tasks:
      - name: "review-diagnostic"
        file: "tasks/review-diagnostic.md"
        description: "Valida cálculos, rastreabilidade de recomendações e emite APROVADO/REJEITADO com feedback específico"

pipeline:
  - step: 1
    name: "upload-dados"
    type: "checkpoint"
    output_file: "squads/financial-health/output/contexto-periodo.md"

  - step: 2
    name: "analise-financeira"
    type: "agent"
    agent: "felipe-financeiro"
    execution: "inline"
    input_file: "squads/financial-health/output/contexto-periodo.md"
    output_file: "squads/financial-health/output/metricas-financeiras.md"

  - step: 3
    name: "diagnostico-estrategico"
    type: "agent"
    agent: "gustavo-gestor"
    execution: "inline"
    input_file: "squads/financial-health/output/metricas-financeiras.md"
    output_file: "squads/financial-health/output/diagnostico-estrategico.md"

  - step: 4
    name: "revisao"
    type: "agent"
    agent: "renata-revisao"
    execution: "inline"
    input_file: "squads/financial-health/output/diagnostico-estrategico.md"
    output_file: "squads/financial-health/output/revisao.md"
    on_reject: 3

  - step: 5
    name: "aprovacao-final"
    type: "checkpoint"

investigation:
  enriched: false

research_brief: |
  Domínio: análise financeira operacional para e-commerce de nicho (moda/acessórios country).
  Frameworks: DRE simplificado, Unit Economics (CAC/LTV), análise de ponto de equilíbrio,
  análise de fluxo de caixa. Benchmarks: margem bruta 45-65%, margem líquida > 15%,
  LTV:CAC > 3:1, frete < 10% da receita, marketing < 20% da receita.

skills_installed:
  - "web_search"
  - "web_fetch"

formats_selected: []

best_practices_consulted:
  - "data-analysis.md"
  - "review.md"