<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@500;700&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #1a0e00;
      overflow: hidden;
      position: relative;
    }
    /* CSS fallback for when AI image is not available */
    .sky-layer {
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom,
        #0d0500 0%,
        #3d1a00 20%,
        #7a3500 35%,
        #c45e00 50%,
        #e8820a 60%,
        #f4a020 70%,
        #c86010 80%,
        #7a2a00 90%,
        #2a0a00 100%
      );
    }
    /* Text zone scrim — obrigatório para fundo quente */
    .text-zone {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 68%;
      background: linear-gradient(to bottom,
        rgba(0,0,0,0.0) 0%,
        rgba(0,0,0,0.55) 22%,
        rgba(0,0,0,0.72) 55%,
        rgba(0,0,0,0.80) 100%
      );
      z-index: 4;
    }
    .bottom-bar {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 4px;
      background: #FFBF1A;
      z-index: 10;
    }
    .logo-area {
      position: absolute;
      bottom: 400px;
      left: 52px;
      z-index: 6;
    }
    #brand-logo { display: flex; align-items: center; }
    .brand-text-fallback {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 22px;
      color: rgba(255,255,255,0.45);
      letter-spacing: 6px;
    }
    .content {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      z-index: 5;
      padding: 0 80px 520px 80px;
    }
    .question {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 148px;
      line-height: 0.88;
      /* BRANCO obrigatório — fundo quente/dourado */
      color: #fff;
      text-shadow: 2px 2px 0 rgba(0,0,0,0.85), 0 0 40px rgba(0,0,0,0.9);
    }
    .poll-hint {
      font-family: 'Montserrat', sans-serif;
      font-size: 44px;
      font-weight: 500;
      color: rgba(255,255,255,0.7);
      margin-top: 24px;
      text-shadow: 1px 1px 4px rgba(0,0,0,0.9);
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div class="sky-layer"></div>
  <div class="text-zone"></div>
  <div class="bottom-bar"></div>
  <div class="logo-area">
    <div id="brand-logo"><span class="brand-text-fallback">BARNS WESTERN</span></div>
  </div>
  <div class="content">
    <div class="question">DO CAMPO<br>PRO ASFALTO.<br>O ESTILO<br>PERMANECE.</div>
  </div>
</body>
</html>
