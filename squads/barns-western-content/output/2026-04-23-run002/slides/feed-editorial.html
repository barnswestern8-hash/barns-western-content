<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1080px; overflow: hidden; }
  .frame {
    width: 1080px; height: 1080px;
    position: relative;
    display: flex; flex-direction: column;
    justify-content: flex-end;
    background: #000;
  }
  .bg {
    position: absolute; inset: 0;
    background-image: url('/assets/products/oculos-roper-2.webp');
    background-size: cover;
    background-position: center 30%;
    filter: brightness(0.38) saturate(0.7);
  }
  .overlay {
    position: absolute; inset: 0;
    background: linear-gradient(
      to bottom,
      rgba(0,0,0,0.05) 0%,
      rgba(0,0,0,0.2) 35%,
      rgba(0,0,0,0.82) 72%,
      rgba(0,0,0,0.97) 100%
    );
  }
  .brand-tag {
    position: absolute; top: 70px; left: 75px; z-index: 3;
    font-family: 'Montserrat', sans-serif;
    font-size: 13px; font-weight: 700;
    letter-spacing: 7px; text-transform: uppercase;
    color: rgba(255,255,255,0.5);
  }
  .content {
    position: relative; z-index: 2;
    padding: 0 75px 80px;
  }
  .hook {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 148px;
    line-height: 0.88;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #FFFFFF;
  }
  .hook .gold { color: #FFBF1A; }
  .divider {
    width: 60px; height: 4px;
    background: #FFBF1A;
    margin: 30px 0 28px;
  }
  .tagline {
    font-family: 'Montserrat', sans-serif;
    font-size: 22px;
    font-weight: 300;
    color: rgba(255,255,255,0.55);
    letter-spacing: 3px;
    text-transform: uppercase;
  }
  .corner-url {
    position: absolute; bottom: 38px; right: 75px; z-index: 3;
    font-family: 'Montserrat', sans-serif;
    font-size: 13px; font-weight: 400;
    letter-spacing: 4px; text-transform: lowercase;
    color: rgba(255,255,255,0.22);
  }
</style>
</head>
<body>
<div class="frame">
  <div class="bg"></div>
  <div class="overlay"></div>
  <div class="brand-tag">Barns Western</div>
  <div class="content">
    <div class="hook">
      O Roper<br>não se<br>explica.<br><span class="gold">Se usa.</span>
    </div>
    <div class="divider"></div>
    <div class="tagline">Roper UV400 — Barns Western</div>
  </div>
  <div class="corner-url">barnswestern.com.br</div>
</div>
</body>
</html>
