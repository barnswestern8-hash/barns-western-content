<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@500;700&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #000;
      overflow: hidden;
      position: relative;
    }
    #bg-image {
      position: absolute;
      inset: 0;
      background-size: 160%;
      background-position: 48% 25%;
      background-repeat: no-repeat;
    }
    #bg-image::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(145deg,
        rgba(0,0,0,0.82) 0%,
        rgba(0,0,0,0.55) 40%,
        rgba(0,0,0,0.7) 70%,
        rgba(0,0,0,0.9) 100%
      );
    }
    .logo-area {
      position: absolute;
      bottom: 380px; left: 80px;
      z-index: 5;
    }
    #brand-logo { display: flex; align-items: center; }
    .brand-text-fallback {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 22px;
      color: rgba(255,255,255,0.35);
      letter-spacing: 6px;
    }
    .content {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      left: 0; right: 0;
      z-index: 4;
      padding: 0 80px;
    }
    .gold-bar {
      width: 64px;
      height: 5px;
      background: #FFBF1A;
      margin-bottom: 44px;
    }
    .headline {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 148px;
      line-height: 0.9;
      color: #fff;
      margin-bottom: 44px;
      text-shadow: 0 2px 20px rgba(0,0,0,0.5);
    }
    .body-text {
      font-family: 'Montserrat', sans-serif;
      font-size: 44px;
      font-weight: 500;
      line-height: 1.6;
      color: rgba(255,255,255,0.88);
      max-width: 860px;
    }
  </style>
</head>
<body>
  <div id="bg-image"></div>
  <div class="logo-area">
    <div id="brand-logo"><span class="brand-text-fallback">🎖 BARNS WESTERN</span></div>
  </div>
  <div class="content">
    <div class="gold-bar"></div>
    <div class="headline">PRESENÇA<br>NÃO SE<br>EXPLICA.</div>
    <div class="body-text">Se percebe. Se sente na chegada. O acessório certo não é detalhe. É declaração silenciosa de quem você é.</div>
  </div>
</body>
</html>
