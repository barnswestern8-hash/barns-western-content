research_brief: |
  Domínio: Conteúdo para Instagram (Feed, Reels, Stories) — nicho country/western brasileiro
  Fonte: Investigação de 5 perfis + best-practices consultadas

  FRAMEWORKS OPERACIONAIS:
  - Estrutura de post Barns Western: Hook (caixa alta, declarativo, máx 8 palavras) → Corpo (contexto de identidade ou especificação com personalidade) → Assinatura ("🎖️ This is Barns.") → CTA + 3-5 hashtags
  - Posicionamento por identidade: definir quem o consumidor É, não o que o produto FAZ
  - Carrossel como formato principal de Feed: 1.4x mais alcance que imagem única (algoritmo re-serve)
  - Engagement hierarchy Feed: Saves > Shares > Comments > Likes
  - Engagement hierarchy Reels: Shares > Saves > Comments > Likes
  - Stories: ferramenta de retenção (seguidores existentes), não de descoberta

  PADRÕES IDENTIFICADOS (cross-profile):
  - Headline declarativa em caixa alta para lançamentos: padrão @bexsunglasses + @ariatinternational
  - Caption curta (1-3 linhas): todos os 5 perfis — visual faz o trabalho pesado
  - UGC estratégico em contexto autêntico do nicho: alto engajamento
  - Estrutura de dois benefícios paralelos: @ariatinternational ("Performance you trust. Style everyone wants.")
  - Nomear produtos como personagens: @tecovas ("Meet The Cartwright")
  - Celebrar autenticidade sobre polimento: @pbr ("The bull wins tonight")

  GAP PRINCIPAL @barns.western: inconsistência de tom entre posts aspiracionais e posts promocionais

  VOCABULÁRIO ADOTAR: "Raízes", "Autêntico", "Firme", "De verdade", "Country de verdade", "Proteção", "O campo", "Estilo que resiste", "Feito pra durar"
  VOCABULÁRIO EVITAR: "Exclusivo" sozinho, "Item", "Incrível", "Maravilhoso", urgência falsa

