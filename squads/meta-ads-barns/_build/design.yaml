investigation:
  enriched: true
  profiles_analyzed: 4
  date: "2026-04-22 a 2026-04-24"
  dir: "squads/meta-ads-barns/_investigations"

research_brief: |
  DOMÍNIO: Meta Ads — nicho country/western brasileiro
  FONTE: 4 investigações de perfis + 5 best-practices + web research 2026

  FRAMEWORKS OPERACIONAIS VALIDADOS:
  - Awareness Level 3 (Solução-Aware): consumidor country sabe que precisa de óculos/acessório,
    não conhece a Barns → copy deve partir da solução, não do problema básico
  - Stage 4 de Sofisticação: claims genéricos invisíveis → diferenciar por identidade específica
  - Estrutura de copy validada: HOOK (1 linha, caixa alta) + DUPLO BENEFÍCIO + PROVA SOCIAL + CTA
  - 99% não clica "ver mais" → hook nos primeiros 125 chars é obrigatório
  - Meta 2026: creative responsável por 56% dos resultados de leilão
  - Teste mínimo: 7 dias para learning phase + 3+ variantes de creative = 22% ROAS superior

  BENCHMARKS BRASIL (fashion/acessórios 2026):
  - CPM: R$20-30 / ~$4-6 USD (Tier 3 — mais barato que EUA/EU)
  - CTR médio: 1.5-2.5%
  - CPC alvo: R$2-5
  - ROAS mínimo viável: 2.5x; alvo: 3.5x+
  - WhatsApp Click-to-Message: growing placement para BOFU no Brasil

  PADRÕES UNIVERSAIS (validados 3+ perfis):
  - Caption 1-3 linhas nos posts de alta performance
  - Reel = formato principal (60-70% do conteúdo)
  - Nenhum uso de urgência artificial em 4/4 perfis
  - Máx 1-3 hashtags branded (não genéricas)
  - Tom declarativo, nunca interrogativo
  - Max 1 emoji de assinatura

  ATIVOS SUBUTILIZADOS BARNS:
  - UV400 aparece só no site — nunca no copy
  - Oferta 50% só na bio — nunca como hook de conversão
  - UGC em highlights — nunca em ads
  - "This is Barns!" — potencial como assinatura de campanha

