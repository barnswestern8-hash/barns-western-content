<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@500;700&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1080px;
      background: #000;
      overflow: hidden;
      position: relative;
      font-family: 'Bebas Neue', sans-serif;
    }
    #bg-image {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center 30%;
      background-repeat: no-repeat;
    }
    #bg-image::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom,
        rgba(0,0,0,0.45) 0%,
        rgba(0,0,0,0.25) 30%,
        rgba(0,0,0,0.55) 60%,
        rgba(0,0,0,0.88) 100%
      );
    }
    .bottom-bar {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 6px;
      background: #FFBF1A;
      z-index: 10;
    }
    .logo-area {
      position: absolute;
      top: 44px;
      right: 52px;
      z-index: 5;
    }
    #brand-logo { display: flex; align-items: center; }
    .brand-text-fallback {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 24px;
      color: rgba(255,255,255,0.5);
      letter-spacing: 7px;
    }
    .content {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      z-index: 4;
      padding: 0 72px 60px 72px;
    }
    .gold-bar {
      width: 52px;
      height: 5px;
      background: #FFBF1A;
      margin-bottom: 22px;
    }
    .headline {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 112px;
      line-height: 0.88;
      color: #fff;
      letter-spacing: -1px;
      margin-bottom: 20px;
      text-shadow: 2px 2px 0 rgba(0,0,0,0.85), 0 0 40px rgba(0,0,0,0.9);
    }
    .sub {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 60px;
      color: #FFBF1A;
      letter-spacing: 5px;
      text-shadow: 1px 1px 6px rgba(0,0,0,0.9);
    }
  </style>
</head>
<body>
  <div id="bg-image"></div>
  <div class="bottom-bar"></div>
  <div class="logo-area">
    <div id="brand-logo"><span class="brand-text-fallback">BARNS WESTERN</span></div>
  </div>
  <div class="content">
    <div class="gold-bar"></div>
    <div class="headline">BONÉS DE QUEM<br>VIVE O CAMPO.</div>
    <div class="sub">NÃO DE QUEM VISITA.</div>
  </div>
</body>
</html>
