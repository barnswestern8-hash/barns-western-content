<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@500;700&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #000;
      overflow: hidden;
      position: relative;
    }
    #bg-image {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center 30%;
      background-repeat: no-repeat;
    }
    #bg-image::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom,
        rgba(0,0,0,0.30) 0%,
        rgba(0,0,0,0.10) 20%,
        rgba(0,0,0,0.40) 55%,
        rgba(0,0,0,0.90) 80%,
        rgba(0,0,0,0.97) 100%
      );
    }
    .bottom-bar {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 4px;
      background: #FFBF1A;
      z-index: 10;
    }
    .logo-area {
      position: absolute;
      bottom: 400px;
      left: 52px;
      z-index: 5;
    }
    #brand-logo { display: flex; align-items: center; }
    .brand-text-fallback {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 22px;
      color: rgba(255,255,255,0.45);
      letter-spacing: 6px;
    }
    .content {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      z-index: 4;
      padding: 0 80px 480px 80px;
    }
    .intro {
      font-family: 'Montserrat', sans-serif;
      font-size: 36px;
      font-weight: 500;
      color: rgba(255,255,255,0.55);
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 16px;
      text-shadow: 1px 1px 4px rgba(0,0,0,0.9);
    }
    .headline {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 148px;
      line-height: 0.87;
      color: #FFBF1A;
      text-shadow: 2px 2px 0 rgba(0,0,0,0.85), 0 0 40px rgba(0,0,0,0.9);
    }
    .sub {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 64px;
      color: rgba(255,255,255,0.85);
      margin-top: 18px;
      text-shadow: 1px 1px 6px rgba(0,0,0,0.9);
      letter-spacing: 3px;
    }
  </style>
</head>
<body>
  <div id="bg-image"></div>
  <div class="bottom-bar"></div>
  <div class="logo-area">
    <div id="brand-logo"><span class="brand-text-fallback">BARNS WESTERN</span></div>
  </div>
  <div class="content">
    <div class="intro">Barns Western</div>
    <div class="headline">CONHEÇA O<br>YELLOWSTONE.</div>
    <div class="sub">O boné que fala antes de você.</div>
  </div>
</body>
</html>
