<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1920px; overflow: hidden; }
  .frame {
    width: 1080px; height: 1920px;
    background: #000000;
    display: flex; flex-direction: column;
    justify-content: center;
    padding: 160px 100px;
    position: relative;
  }
  .accent-line {
    width: 6px; height: 120px;
    background: #FFBF1A;
    margin-bottom: 60px;
  }
  .label {
    font-family: 'Montserrat', sans-serif;
    font-size: 14px; font-weight: 700;
    letter-spacing: 9px; text-transform: uppercase;
    color: rgba(255,255,255,0.35);
    margin-bottom: 48px;
  }
  .headline {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 138px;
    line-height: 0.88;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #FFFFFF;
    margin-bottom: 60px;
  }
  .headline em { color: #FFBF1A; font-style: normal; }
  .body {
    font-family: 'Montserrat', sans-serif;
    font-size: 34px;
    font-weight: 300;
    line-height: 1.65;
    color: rgba(255,255,255,0.65);
    border-left: 3px solid rgba(255,191,26,0.4);
    padding-left: 36px;
  }
  .corner-logo {
    position: absolute; top: 80px; right: 80px;
    font-family: 'Montserrat', sans-serif;
    font-size: 13px; font-weight: 700;
    letter-spacing: 5px; text-transform: uppercase;
    color: rgba(255,255,255,0.2);
  }
</style>
</head>
<body>
<div class="frame">
  <div class="corner-logo">@barns.western</div>
  <div class="accent-line"></div>
  <div class="label">Presença</div>
  <div class="headline">Quem usa<br>Barns não<br>precisa<br><em>explicar.</em></div>
  <div class="body">
    Você entra na arena.<br>
    O óculos já disse<br>tudo por você.
  </div>
</div>
</body>
</html>
