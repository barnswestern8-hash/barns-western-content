<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1920px; overflow: hidden; }
  .frame {
    width: 1080px; height: 1920px;
    position: relative;
    background: #000;
    display: flex; flex-direction: column;
    justify-content: flex-end;
  }
  .bg {
    position: absolute; inset: 0;
    background-image: url('/assets/products/oculos-roper-3.webp');
    background-size: cover;
    background-position: center;
    filter: brightness(0.3) saturate(0.55);
  }
  .overlay {
    position: absolute; inset: 0;
    background: linear-gradient(180deg,
      rgba(0,0,0,0.1) 0%,
      rgba(0,0,0,0.3) 40%,
      rgba(0,0,0,0.96) 85%,
      rgba(0,0,0,1) 100%
    );
  }
  .content {
    position: relative; z-index: 2;
    padding: 0 100px 170px;
  }
  .label {
    font-family: 'Montserrat', sans-serif;
    font-size: 13px; font-weight: 700;
    letter-spacing: 10px; text-transform: uppercase;
    color: rgba(255,255,255,0.4);
    margin-bottom: 40px;
  }
  .headline {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 118px;
    line-height: 0.9;
    text-transform: uppercase;
    color: #FFFFFF;
    margin-bottom: 40px;
    letter-spacing: 2px;
  }
  .body {
    font-family: 'Montserrat', sans-serif;
    font-size: 32px;
    font-weight: 300;
    line-height: 1.65;
    color: rgba(255,255,255,0.62);
    margin-bottom: 52px;
  }
  .body strong { color: #FFBF1A; font-weight: 700; }
  .highlight-box {
    background: rgba(255,191,26,0.1);
    border: 1px solid rgba(255,191,26,0.3);
    border-radius: 16px;
    padding: 32px 42px;
    font-family: 'Montserrat', sans-serif;
    font-size: 26px; font-weight: 400;
    color: rgba(255,255,255,0.7);
    font-style: italic;
    line-height: 1.5;
  }
  .corner-logo {
    position: absolute; top: 80px; right: 80px; z-index: 3;
    font-family: 'Montserrat', sans-serif;
    font-size: 13px; font-weight: 700;
    letter-spacing: 5px; text-transform: uppercase;
    color: rgba(255,255,255,0.3);
  }
</style>
</head>
<body>
<div class="frame">
  <div class="bg"></div>
  <div class="overlay"></div>
  <div class="corner-logo">@barns.western</div>
  <div class="content">
    <div class="label">Bastidor</div>
    <div class="headline">Cada<br>detalhe<br>tem razão.</div>
    <div class="body">
      O Roper não foi projetado<br>
      pra parecer bom.<br>
      Foi projetado pra <strong>ser bom.</strong>
    </div>
    <div class="highlight-box">
      "A BARNS nasceu de quem conhece o campo — não de quem imagina como é."
    </div>
  </div>
</div>
</body>
</html>
