<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@500;700&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #040302;
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0 88px;
      text-align: center;
    }
    .bg-glow {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 80% 60% at 50% 50%,
        rgba(255,191,26,0.06) 0%,
        transparent 65%
      );
    }
    .question {
      position: relative;
      z-index: 2;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 122px;
      line-height: 0.9;
      color: #fff;
      margin-bottom: 80px;
    }
    .divider {
      position: relative;
      z-index: 2;
      width: 80px;
      height: 3px;
      background: #FFBF1A;
      margin-bottom: 80px;
    }
    .identity-list {
      position: relative;
      z-index: 2;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 48px;
    }
    .identity-line {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 72px;
      color: rgba(255,255,255,0.55);
      letter-spacing: 3px;
      line-height: 1;
    }
    .identity-line.gold {
      color: #FFBF1A;
      font-size: 80px;
    }
    .logo-area {
      position: absolute;
      bottom: 380px; left: 0; right: 0;
      text-align: center;
      z-index: 5;
    }
    #brand-logo { display: inline-flex; align-items: center; }
    .brand-text-fallback {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 22px;
      color: rgba(255,255,255,0.25);
      letter-spacing: 6px;
    }
  </style>
</head>
<body>
  <div class="bg-glow"></div>
  <div class="question">QUAL É<br>O SEU<br>ESTILO<br>BARNS?</div>
  <div class="divider"></div>
  <div class="identity-list">
    <div class="identity-line">Campo. Sempre fui.</div>
    <div class="identity-line gold">Cidade com raiz.</div>
  </div>
  <div class="logo-area">
    <div id="brand-logo"><span class="brand-text-fallback">🎖 BARNS WESTERN</span></div>
  </div>
</body>
</html>
