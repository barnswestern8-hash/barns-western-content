<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@500;700&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #000;
      overflow: hidden;
      position: relative;
    }
    #bg-image {
      position: absolute;
      inset: 0;
      background-size: 160%;
      background-position: 52% 40%;
      background-repeat: no-repeat;
    }
    #bg-image::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom,
        rgba(0,0,0,0.35) 0%,
        rgba(0,0,0,0.1) 20%,
        rgba(0,0,0,0.2) 50%,
        rgba(0,0,0,0.82) 75%,
        rgba(0,0,0,0.96) 100%
      );
    }
    .logo-area {
      position: absolute;
      top: 52px; right: 52px;
      z-index: 5;
    }
    #brand-logo { display: flex; align-items: center; }
    .brand-text-fallback {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 22px;
      color: rgba(255,255,255,0.5);
      letter-spacing: 6px;
    }
    .content {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      z-index: 4;
      padding: 0 80px 96px 80px;
    }
    .tag {
      font-family: 'Montserrat', sans-serif;
      font-size: 30px;
      font-weight: 500;
      color: rgba(255,255,255,0.6);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 22px;
    }
    .headline {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 162px;
      line-height: 0.87;
      color: #fff;
      margin-bottom: 26px;
      text-shadow: 0 2px 24px rgba(0,0,0,0.6);
    }
    .gold-bar {
      width: 56px;
      height: 5px;
      background: #FFBF1A;
      margin-bottom: 22px;
    }
    .sub {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 72px;
      color: #FFBF1A;
      letter-spacing: 6px;
      margin-bottom: 40px;
    }
    .cta-hint {
      font-family: 'Montserrat', sans-serif;
      font-size: 30px;
      font-weight: 500;
      color: rgba(255,255,255,0.45);
      letter-spacing: 2px;
    }
    .bottom-bar {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 4px;
      background: #FFBF1A;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div id="bg-image"></div>
  <div class="bottom-bar"></div>
  <div class="logo-area">
    <div id="brand-logo"><span class="brand-text-fallback">BARNS WESTERN</span></div>
  </div>
  <div class="content">
    <div class="headline">QUEM<br>CHEGOU<br>CHEGOU.</div>
    <div class="gold-bar"></div>
    <div class="sub">SEM EXPLICAÇÃO.</div>
  </div>
</body>
</html>
