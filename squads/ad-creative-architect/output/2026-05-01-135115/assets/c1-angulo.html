<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; background: #000; }
  .frame { width: 1080px; height: 1350px; position: relative; overflow: hidden; }
  .bg { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; display: block; }
  .top-scrim {
    position: absolute; top: 0; left: 0; right: 0; height: 55%;
    background: linear-gradient(to bottom, rgba(0,0,0,0.52) 0%, rgba(0,0,0,0.28) 40%, transparent 100%);
  }
  .bottom-scrim {
    position: absolute; bottom: 0; left: 0; right: 0; height: 30%;
    background: linear-gradient(to top, rgba(0,0,0,0.90) 0%, rgba(0,0,0,0.50) 55%, transparent 100%);
  }
  .headline {
    position: absolute; top: 0; left: 0; right: 0;
    padding: 50px 54px 0;
    font-family: 'Bebas Neue', Impact, sans-serif;
    font-weight: 400;
    color: #ffffff;
    font-size: 76px;
    line-height: 1.0;
    text-shadow: 2px 2px 0 rgba(0,0,0,0.85), 0 0 40px rgba(0,0,0,0.9);
  }
  .bottom-content {
    position: absolute; bottom: 0; left: 0; right: 0;
    padding: 0 54px 50px;
  }
  .subtitle {
    font-family: 'Montserrat', Arial, sans-serif;
    font-weight: 400;
    color: rgba(255,255,255,0.95);
    font-size: 30px;
    line-height: 1.45;
    margin-bottom: 22px;
    text-shadow: 1px 1px 6px rgba(0,0,0,0.9);
  }
  .cta-row { display: flex; align-items: center; justify-content: space-between; }
  .cta {
    font-family: 'Bebas Neue', Impact, sans-serif;
    font-weight: 400; font-size: 38px;
    background: #FFBF1A; color: #000000;
    padding: 12px 36px; letter-spacing: 2px;
    display: inline-block; line-height: 1;
  }
  .logo { height: 56px; }
</style>
</head>
<body>
<div class="frame">
  <img class="bg" src="http://127.0.0.1:8891/squads/ad-creative-architect/output/2026-05-01-135115/assets/protocolo-A-feed-4x5.png" />
  <div class="top-scrim"></div>
  <div class="bottom-scrim"></div>
  <div class="headline">‘COMPREI DESCONFIADO. CHEGOU EXATO.’</div>
  <div class="bottom-content">
    <div class="subtitle">O óculos que chegou igual à foto. E a troca que seria fácil se precisasse.</div>
    <div class="cta-row">
      <div class="cta">CONHEÇA O HUNTER</div>
      <img class="logo" src="http://127.0.0.1:8891/squads/barns-western-content/assets/brand/logo%20branco.png" />
    </div>
  </div>
</div>
</body>
</html>
