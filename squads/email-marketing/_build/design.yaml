research_brief: |
  ## E-mail Marketing para E-commerce — Pesquisa 2026

  ### Frameworks Chave
  - PAS (Problem-Agitate-Solution): ideal para e-mails de abandono de carrinho e recompra
  - AIDA (Attention-Interest-Desire-Action): ideal para boas-vindas e campanhas frias
  - Segmentação comportamental: 760% mais receita que blasts não-segmentados

  ### Fluxos Essenciais
  1. Boas-vindas: 50% de abertura, 10-15% de conversão, 10x mais receita/e-mail que campanhas comuns
  2. Abandono de carrinho: 3 e-mails (1h, 24h, 48h) — recupera 15-20% dos carrinhos
  3. Recompra/Upsell: trigger pós-compra (7, 14, 30 dias)
  4. Campanhas promocionais: datas sazonais, lançamentos, promoções relâmpago

  ### Benchmarks 2026 (E-commerce)
  - Taxa de abertura média: 43.46%
  - Taxa de clique: 2.44%
  - Fluxos automáticos: 41% da receita de e-mail com apenas 5.3% dos envios
  - RPE de fluxos: até 18x maior que campanhas manuais
  - ROI e-mail: R$36-42 para cada R$1 investido

  ### Anti-Padrões Confirmados
  - Batch-and-blast sem segmentação: maior causa de descadastros
  - HTML pesado em e-mails frios: cai em spam
  - Múltiplos CTAs: dilui conversão
  - Sem follow-up: perde 80% das conversões potenciais

  ### Mobile
  - 60-70% das aberturas no mobile
  - Single column, 600px, CTA tap-friendly (min 44x44px), 16px+ body text